[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-local"
version = "0.1.0"
description = "Local-first job application manager for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["jam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"jam/ui/*" = ["BLE001"]
