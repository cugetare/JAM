[jam]
applications_root = "data/Applications"
database_path = "data/jam.sqlite3"
german_cv_master = ""
english_cv_master = ""
german_cover_letter_template = ""
english_cover_letter_template = ""
bewerbungsliste_path = "data/Bewerbungsliste.xlsx"
default_application_language = "DE"
default_source = "Company website"
filename_convention = "{document}_{name}_{language}_{company}_{job_ref}"
applicant_name = "Applicant"
date_format = "%d.%m.%Y"
bewerbungsliste_column_mapping = ""
candidate_facts_path = "data/candidate_facts.md"
candidate_profile_path = "data/candidate_profile.json"
active_candidate_profile_id = "default"
agent_instructions_path = "data/agent_instructions.md"
openai_model = "gpt-5.6-terra"
openai_reasoning_effort = "medium"
openai_max_output_tokens = "4000"
strategy_language = "EN"
openai_data_sharing_enabled = "false"
